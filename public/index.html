<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OpenClose</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src *; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="vendor/github-dark.min.css">
<style>
:root{--bg:#000;--s1:#080808;--s2:#0d0d0d;--bd:#202020;--tx:#f2f2f2;--t2:#929292;--t3:#666;--ac:#c6f432;--err:#ff6b6b;font-family:Inter,Geist,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ib{min-width:44px;min-height:44px;display:inline-grid;place-items:center;border-radius:8px;color:var(--t2)}.ib:hover{background:var(--s2);color:var(--tx)}
.btn{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;min-height:40px}.btn:hover{background:var(--s2)}.btn.p{background:var(--ac);color:#000;border-color:var(--ac);font-weight:600}.btn.d{color:var(--err)}
input,select,textarea{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
label{display:block;font-size:12px;color:var(--t2);margin:12px 0 4px}
#auth{min-height:100%;display:grid;place-items:center;padding:20px}#auth form{width:100%;max-width:340px}
#app{display:grid;grid-template-columns:272px 1fr;height:100dvh}
aside{background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.logo{font-weight:700;letter-spacing:-.02em;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo b{color:var(--ac)}
.side-a{padding:0 10px;display:grid;gap:6px}
#hist{flex:1;overflow:auto;padding:8px 10px}.grp{font-size:11px;color:var(--t3);padding:12px 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.ci{display:flex;align-items:center;border-radius:8px}.ci:hover,.ci.on{background:var(--s2)}
.ci .t{flex:1;text-align:left;padding:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}.ci.on .t{color:var(--tx)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
header{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid var(--bd)}
header h1{font-size:14px;font-weight:600;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msel{width:auto;max-width:42vw;padding:8px}
#thread{flex:1;overflow:auto;padding:24px 16px 8px}.col{max-width:760px;margin:0 auto}
.msg{margin:0 0 26px}.who{font-size:12px;color:var(--t3);margin-bottom:6px}
.msg.user .body{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;white-space:pre-wrap;width:fit-content;max-width:100%;margin-left:auto}
.body{line-height:1.7;overflow-wrap:anywhere}.body p{margin:0 0 .9em}.body a{color:var(--ac)}
.body table{border-collapse:collapse;display:block;overflow-x:auto}.body td,.body th{border:1px solid var(--bd);padding:6px 10px}
.body blockquote{border-left:2px solid var(--bd);margin:0 0 1em;padding-left:14px;color:var(--t2)}
.body :not(pre)>code{background:var(--s2);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font:13px "JetBrains Mono","Geist Mono",ui-monospace,monospace}
.cb{border:1px solid var(--bd);border-radius:10px;background:#050505;margin:0 0 1em;overflow:hidden}
.cb .h{display:flex;align-items:center;padding:2px 4px 2px 12px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2)}.cb .h span{flex:1}
.cb pre{margin:0;overflow-x:auto;padding:12px 14px}.cb code{font:13px/1.55 "JetBrains Mono","Geist Mono",ui-monospace,monospace;background:none!important;padding:0!important}.cb.long pre{max-height:320px}.cb.long.open pre{max-height:none}
.tools{display:flex;gap:2px;margin-top:4px;opacity:.55}.msg:hover .tools{opacity:1}.tools .ib{min-width:36px;min-height:36px}
.note{text-align:center;font-size:12px;color:var(--t3);border-top:1px solid var(--bd);padding-top:8px;margin:0 0 26px}.err{color:var(--err);font-size:13px}.warn{color:var(--t3);font-size:12px}
#comp{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}.cbox{max-width:760px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:6px 6px 6px 14px}
.cbox textarea{border:0;background:none;resize:none;max-height:200px;padding:10px 0;flex:1}.cbox textarea:focus{outline:0}
.hint{text-align:center;font-size:11px;color:var(--t3);margin-top:6px}
#jump{position:absolute;right:50%;transform:translateX(50%);bottom:96px;background:var(--s2);border:1px solid var(--bd);border-radius:50%;width:40px;height:40px;display:none;place-items:center}
.empty{text-align:center;margin-top:18vh}.empty h2{font-weight:600;letter-spacing:-.02em}.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.sug button{border:1px solid var(--bd);border-radius:8px;padding:9px 12px;color:var(--t2)}.sug button:hover{color:var(--tx);background:var(--s2)}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}dialog::backdrop{background:#000a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{display:flex;align-items:center;border-bottom:1px solid var(--bd)}.mi div{flex:1;padding:10px 0}.mi small{color:var(--t3);display:block}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
#menu{position:fixed;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:8;display:none;min-width:150px}#menu button{display:block;width:100%;text-align:left;padding:10px;border-radius:6px}#menu button:hover{background:var(--s2)}
.only-m{display:none}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:5;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.scrim{position:fixed;inset:0;background:#000a;z-index:4;display:none}.scrim.on{display:block}.only-m{display:inline-grid}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
input[type=checkbox],input[type=radio],input[type=file]{width:auto}.pre{white-space:pre-line}dialog{overflow:auto}</style></head><body>
<div id="app"><div class="scrim" id="scrim"></div>
<aside id="side"><div class="logo"><span>Open<b>Close</b></span><button class="ib only-m" id="closeSide" aria-label="Close menu" title="Close menu"></button></div>
<div class="side-a"><button class="btn" id="newc" style="text-align:left"></button><input id="q" type="search" placeholder="Search chats" aria-label="Search chats"></div>
<div id="hist"></div><div class="side-a" style="padding-bottom:10px"><button class="btn" id="mm" style="text-align:left"></button><button class="btn" id="set" style="text-align:left"></button></div></aside>
<main><header><button class="ib only-m" id="openSide" aria-label="Open menu" title="Menu"></button><h1 id="title">New chat</h1>
<select id="msel" aria-label="Model"></select><button class="ib" id="ctxb" aria-label="Clear context" title="Clear context"></button><button class="ib" id="exp" aria-label="Export conversation as Markdown" title="Export chat"></button></header>
<div id="thread"><div class="col" id="msgs"></div></div><button id="jump" aria-label="Jump to latest" title="Jump to latest"></button>
<div id="comp"><div class="cbox"><textarea id="in" rows="1" placeholder="Message" aria-label="Message"></textarea><button class="ib" id="send" aria-label="Send" title="Send"></button></div><div class="hint" id="hint"></div></div></main></div>
<dialog id="dlg"></dialog><div id="menu"></div><div id="toast" role="status"></div>
<script src="vendor/marked.min.js"></script><script src="vendor/purify.min.js"></script><script src="vendor/highlight.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="vendor/katex/auto-render.min.js"></script>
<script type="module" src="app.js"></script></body></html>
